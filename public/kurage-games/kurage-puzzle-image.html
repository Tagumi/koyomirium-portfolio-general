<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>くらげぷかぷか IMAGE EDITION</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01031a}body{display:grid;place-items:center}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.sr{position:fixed;left:-9999px}</style></head><body><canvas id="game" width="1536" height="1024" aria-label="画像で描かれた8ビットクラゲパズル"></canvas><span class="sr" id="live" aria-live="polite"></span><script>
const cv=document.getElementById('game'),x=cv.getContext('2d');x.imageSmoothingEnabled=false;const bg=new Image(),sp=new Image(),rs=new Image(),topImg=new Image();bg.src='puzzle-ui-generated.png';sp.src='puzzle-jellies.png';rs.src='puzzle-result-generated.png';topImg.src='puzzle-top.png';const R=8,C=8,BX=284,BY=319,CW=120.5,CH=64;let started=false,board,score,moves,busy=false,result=-1;const rnd=()=>Math.random()*5|0;
function showTop(){started=false;if(topImg.complete)x.drawImage(topImg,0,0,1536,1024)}
function reset(){started=true;board=Array.from({length:R},()=>Array.from({length:C},rnd));score=0;moves=25;busy=false;result=-1;draw()}
function draw(){if(!started){showTop();return}if(!bg.complete||!sp.complete)return;x.drawImage(bg,0,0,1536,1024);for(let r=0;r<R;r++)for(let c=0;c<C;c++)drawJelly(board[r][c],BX+c*CW+23,BY+r*CH+2,75,60);x.fillStyle='#07051f';x.fillRect(130,881,596,28);x.fillStyle='#ff67ba';let w=Math.min(596,score/3500*596);for(let p=0;p<w;p+=20)x.fillRect(130+p,881,15,28);if(result>=0&&rs.complete){let sx=result===1?0:768;x.fillStyle='#03021ddd';x.fillRect(0,0,1536,1024);x.drawImage(rs,sx,0,768,1024,384,0,768,1024)}}
function drawJelly(i,dx,dy,dw,dh){let sw=sp.naturalWidth/5,sy=60,sh=sp.naturalHeight-90;x.drawImage(sp,i*sw,sy,sw,sh,dx,dy,dw,dh)}
function group(r,c){let col=board[r][c],seen=new Set(),q=[[r,c]];while(q.length){let [y,z]=q.pop(),k=y+','+z;if(seen.has(k)||y<0||y>=R||z<0||z>=C||board[y][z]!==col)continue;seen.add(k);q.push([y-1,z],[y+1,z],[y,z-1],[y,z+1])}return seen}
function pop(r,c){if(busy||moves<=0)return;let g=group(r,c);if(g.size<2){document.getElementById('live').textContent='ひとりぼっちだよ';return}busy=true;let frames=0,t=setInterval(()=>{draw();g.forEach(k=>{let [y,z]=k.split(',').map(Number),cx=BX+z*CW+60,cy=BY+y*CH+32;x.fillStyle=frames%2?'#fff':'#ffeb70';for(let n=0;n<8;n++)x.fillRect(cx+((n%3)-1)*frames*7,cy+((n/3|0)-1)*frames*6,7,7)});if(++frames>4){clearInterval(t);collapse(g);busy=false}},70)}
function collapse(g){for(let c=0;c<C;c++){let keep=[];for(let r=R-1;r>=0;r--)if(!g.has(r+','+c))keep.push(board[r][c]);for(let r=R-1,i=0;r>=0;r--,i++)board[r][c]=keep[i]??rnd()}score+=g.size*g.size*10;moves--;if(moves===0)result=score>=3500?1:0;draw()}
cv.addEventListener('click',e=>{let q=cv.getBoundingClientRect(),px=(e.clientX-q.left)*1536/q.width,py=(e.clientY-q.top)*1024/q.height;if(!started){if(py>720)reset();return}if(result>=0){if(py>690&&py<860&&px>480&&px<790)reset();else if(py>690&&py<860&&px>800&&px<1110)showTop();return}if(px>BX&&px<BX+C*CW&&py>BY&&py<BY+R*CH)pop(Math.floor((py-BY)/CH),Math.floor((px-BX)/CW));if(px>1300&&py>880)showTop()});addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&started)reset()});[bg,sp,rs,topImg].forEach(i=>i.onload=()=>started?draw():showTop());
</script></body></html>
