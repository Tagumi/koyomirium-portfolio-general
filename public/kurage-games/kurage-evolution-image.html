<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>くらげ育成日記 IMAGE EDITION</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02051f}body{display:grid;place-items:center}.stage{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.name-input{display:none;position:absolute;left:26%;top:55%;width:48%;height:11%;border:0;outline:0;background:transparent;color:#fff;text-align:center;font:900 clamp(20px,5vw,66px)/1 monospace;letter-spacing:.08em;text-shadow:5px 0 #092656,0 5px #092656;image-rendering:pixelated}.name-input.show{display:block}.sr{position:fixed;left:-9999px}</style></head><body><div class="stage"><canvas id="game" width="1536" height="1024" aria-label="画像UI版くらげ育成日記"></canvas><input id="kurageName" class="name-input" maxlength="8" autocomplete="off" aria-label="クラゲの名前"></div><span class="sr" id="live" aria-live="polite"></span><script>
const cv=document.getElementById('game'),x=cv.getContext('2d'),nameInput=document.getElementById('kurageName');x.imageSmoothingEnabled=false;const ui=new Image(),heartSrc=new Image(),resultImg=new Image(),completeImg=new Image(),sprites=new Image(),nameImg=new Image(),topImg=new Image(),nameScreenImg=new Image();ui.src='game-ui-3feeds-3hearts.png';heartSrc.src='game-ui-generated.png';resultImg.src='game-evolution-result.png';completeImg.src='game-complete-generated.png';sprites.src='jelly-species-11-owan-v2.png';nameImg.src='jelly-name-labels.png';topImg.src='evolution-top.png';nameScreenImg.src='evolution-name-entry.png';const foods=[[50,610,397,818],[425,610,755,818],[780,610,1105,818],[1128,610,1490,818]],colors=['#83e7ef','#ed5b85','#69e99c','#eda742','#d6b1e8','#9bbb58','#d6edff','#507ed8','#eac259','#9a72da'],names=['ミズクラゲ','アカクラゲ','オワンクラゲ','パシフィックシーネットル','エチゼンクラゲ','サカサクラゲ','ギンカクラゲ','カツオノエボシ','タコクラゲ','カラージェリーフィッシュ'];let scene='top',playerName=localStorage.getItem('imageKurageName')||'',spritesReady=false,fed=0,eats=[0,0,0,0],busy=false,evolved=-1,modal=false,complete=false,plays=Number(localStorage.getItem('imageKuragePlays')||0),seen=new Set(JSON.parse(localStorage.getItem('imageKurageDex')||'[]'));
function screen(){nameInput.classList.toggle('show',scene==='name');if(scene==='top'){if(topImg.complete)x.drawImage(topImg,0,0,1536,1024);return}if(scene==='name'){if(nameScreenImg.complete)x.drawImage(nameScreenImg,0,0,1536,1024);return}x.drawImage(ui,0,0,1536,1024);drawPlayerName();drawHearts();drawSlots();drawDex();if(evolved<0)baby(768,335,1);else species(768,335,evolved,1)}
function drawPlayerName(){x.drawImage(heartSrc,80,20,335,125,45,20,350,125);x.save();x.textAlign='center';x.textBaseline='middle';x.font='900 34px monospace';x.fillStyle='#fff';x.fillText(playerName||'なまえなし',220,91);x.restore()}
function resetRun(){fed=0;eats=[0,0,0,0];evolved=-1;modal=false;complete=false;busy=false}
function openName(){resetRun();scene='name';nameInput.value=playerName;screen();setTimeout(()=>nameInput.focus(),0)}
function confirmName(){playerName=nameInput.value.trim()||'くらげ';localStorage.setItem('imageKurageName',playerName);resetRun();scene='game';nameInput.blur();screen()}
function drawHearts(){if(!heartSrc.complete)return;const src=[1154,1209,1264],dst=[1182,1256,1330];for(let i=0;i<fed;i++)x.drawImage(heartSrc,src[i],79,48,48,dst[i],79,48,48)}
function drawSlots(){x.fillStyle='#070524';x.fillRect(65,886,1170,104);for(let i=0;i<10;i++)x.drawImage(ui,72,890,108,94,74+i*115,890,108,94)}
function drawDex(){for(let i=0;i<10;i++)if(seen.has(i)){let cx=128+i*115;x.fillStyle='#080629';x.fillRect(cx-44,900,88,75);drawSprite(i+1,cx,938,76,70)}}
function prepareSprites(){spritesReady=true;screen()}
function drawSprite(index,cx,cy,w,h){if(!spritesReady)return;let sw=sprites.naturalWidth/4,sh=sprites.naturalHeight/3,sx=(index%4)*sw,sy=Math.floor(index/4)*sh;x.drawImage(sprites,sx,sy,sw,sh,cx-w/2,cy-h/2,w,h)}
function baby(cx,cy,s){drawSprite(0,cx,cy,236*s,236*s)}
function species(cx,cy,k,s){drawSprite(k+1,cx,cy,235*s,220*s)}
function feed(i){if(busy||modal||complete)return;busy=true;fed++;eats[i]++;let f=0,t=setInterval(()=>{screen();let b=foods[i],sx=b[0]+(b[2]-b[0])/2,sy=690-(f*55);x.fillStyle=f%2?'#fff176':colors[i];x.fillRect(sx-9,sy-9,18,18);baby(768,335,1+(f%2)*.1);if(++f>5){clearInterval(t);busy=false;screen();if(fed===3)evolve()}},70)}
function pick(){plays++;localStorage.setItem('imageKuragePlays',plays);let unseen=colors.map((_,i)=>i).filter(i=>!seen.has(i)),mustFind=unseen.length>=14-plays;if(unseen.length&&mustFind)return unseen[Math.floor(Math.random()*unseen.length)];return Math.floor(Math.random()*10)}
function evolve(){busy=true;let kind=pick(),f=0,t=setInterval(()=>{screen();x.fillStyle=f%2?'#fff':'#6ef2ea';for(let n=0;n<32;n++){let a=n*Math.PI*2/32,r=f*24;x.fillRect(764+Math.cos(a)*r,330+Math.sin(a)*r,9,9)}if(f%2===0){x.fillStyle='#fff';x.fillRect(668,240,200,190)}if(++f>7){clearInterval(t);seen.add(kind);localStorage.setItem('imageKurageDex',JSON.stringify([...seen]));reveal(kind)}},105)}
function reveal(kind){let f=0,t=setInterval(()=>{screen();species(768,335,kind,[.2,.4,.65,.9,1.05,.9][Math.min(f,5)]);if(++f>5){clearInterval(t);evolved=kind;busy=false;showResult(kind)}},85)}
function drawSpeciesName(kind){if(!nameImg.complete)return;let sw=nameImg.naturalWidth/2,sh=nameImg.naturalHeight/5,sx=(kind%2)*sw,sy=Math.floor(kind/2)*sh;x.drawImage(nameImg,sx,sy,sw,sh,468,665,600,88)}
function showResult(kind){modal=true;x.drawImage(resultImg,0,0,1536,1024);species(768,500,kind,1.55);drawSpeciesName(kind);document.getElementById('live').textContent=names[kind]+'に進化しました';try{parent.postMessage({type:'kurage-evolved'},'*')}catch(e){}if(seen.size===10)setTimeout(()=>{complete=true;modal=false;x.drawImage(completeImg,0,0,1536,1024)},900)}
function next(){fed=0;eats=[0,0,0,0];evolved=-1;modal=false;busy=false;screen()}
function resetCollection(){seen.clear();fed=0;eats=[0,0,0,0];evolved=-1;modal=false;complete=false;plays=0;localStorage.removeItem('imageKurageDex');localStorage.removeItem('imageKuragePlays');screen()}
cv.addEventListener('click',e=>{let r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*1536/r.width,py=(e.clientY-r.top)*1024/r.height;if(scene==='top'){if(py>680)openName();return}if(scene==='name'){if(py>770)confirmName();return}if(complete){if(px>390&&px<1150&&py>780&&py<955)resetCollection();return}if(modal){if(px>180&&px<750&&py>775&&py<950)next();else if(px>805&&px<1370&&py>775&&py<950){scene='top';screen()}return}foods.forEach((b,i)=>{if(px>b[0]&&px<b[2]&&py>b[1]&&py<b[3])feed(i)});if(px>1280&&py>835){scene='top';screen()}});nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')confirmName()});[ui,heartSrc,nameImg,topImg,nameScreenImg].forEach(i=>i.onload=screen);sprites.onload=prepareSprites;if(sprites.complete&&sprites.naturalWidth)prepareSprites();
</script></body></html>
